services:
  - type: web
    name: media-gen-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: META_TOKEN
        sync: false   # optional: overrides the embedded token if set
      - key: META_TOKEN_2
        sync: false   # second Meta account token (powers /api/image2)
      - key: META_EMAIL
        sync: false   # optional: overrides the embedded login email
      - key: META_PASSWORD
        sync: false   # optional: overrides the embedded login password
